# Supply-chain hardening: verify every GitHub Action used in this repo is pinned to a full commit
# SHA (not a moving tag like @v4). Pinning prevents a compromised/retagged action from silently
# running with our write permissions. This job only verifies; it does not push fixes.
#
# To auto-pin locally when adding a new action, run pinact (https://github.com/suzuki-shunsuke/pinact)
# or `pinact run`, then commit the result.
name: Pin GitHub Actions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pinact:
    name: pinact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check pinned GitHub Actions
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          skip_push: 'true'
          fix: 'false'
          verify: 'true'
